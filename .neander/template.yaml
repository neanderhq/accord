contract_version: 1
id: accord
title: Accord
description: |
  **Prepare, send and track documents for signature.**

  Accord is a company e-signature workspace with PDF field placement, sequential or parallel routing, and signed PDFs with evidence receipts. Preview and send up to 25 separate envelopes from a single-signer template, share a signing link that verifies each visitor’s email, or send a PDF-only completion copy to a non-signer.

  Explore fictional agreements, contacts and an archived envelope. DOCX conversion supports basic text, table grids and explicit page breaks. Upload a PDF when exact document presentation is required. Email delivery requires a configured sender and job runner. Webhooks use your own endpoint.
category: Documents & E-signatures
best_for: Small teams preparing agreements and managing document signatures
features:
  - PDF documents and signature field placement
  - Sequential and parallel recipient routing
  - Signing consent and signed-PDF evidence receipts
  - Active, archived and deleted envelope filters with CSV export
  - Contacts, reusable templates and company roles
  - CSV preview and bulk send for up to 25 single-signer envelopes
  - Revocable 30-day links to signed PDFs for non-signers
  - Self-service signing links with single-use email verification
  - Delivery logs, reminders and recovery exports
included:
  - E-signature application
  - PostgreSQL migrations
  - Fictional agreements, contacts and staff accounts
  - Email layouts for signing requests, verification and completion copies
  - Email, scheduler and DOCX limitations guide
thumbnail: .neander/thumbnail.png
screenshots:
  - .neander/screenshots/bulk-send.png
  - .neander/screenshots/completion-copy.png
  - .neander/screenshots/public-signing-link.png
  - .neander/screenshots/public-signing-document.png
  - .neander/screenshots/agreement.png
  - .neander/screenshots/archived.png
commands:
  install: [pnpm, install, --frozen-lockfile]
  check: [pnpm, run, check]
  test: [pnpm, run, test]
  verify: [pnpm, run, test:template]
seed:
  command: [pnpm, run, db:seed]
