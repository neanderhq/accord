name: Accord checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accord_test
          POSTGRES_PASSWORD: accord_test_only
          POSTGRES_DB: accord_integration
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U accord_test -d accord_integration"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://accord_test:accord_test_only@127.0.0.1:5432/accord_integration
      TEAM_ESIGN_DEV_DATABASE: '1'
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: accord-ci-auth-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accord_test
          POSTGRES_PASSWORD: accord_test_only
          POSTGRES_DB: accord_template
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U accord_test -d accord_template"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://accord_test:accord_test_only@127.0.0.1:5432/accord_template
      NEANDER_TEMPLATE_TEST_DATABASE_URL: postgresql://accord_test:accord_test_only@127.0.0.1:5432/accord_template
      NEANDER_TEMPLATE_IMAGE: accord:ci
      BETTER_AUTH_URL: http://127.0.0.1:8080
      BETTER_AUTH_SECRET: accord-ci-auth-key-at-least-32-characters
      COMPANY_SETUP_KEY: accord-ci-company-setup-key-32-characters
      DEMO_PASSWORD: Accord-ci-demo-password!
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: docker build -f .neander/Dockerfile -t accord:ci .
      - run: python3 scripts/test_entrypoint.py
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:template
